[build-system]
requires = ["uv_build==0.9.15"]
build-backend = "uv_build"

[project]
name = "jimu-runtime"
version = "0.1.0"
description = "JIMU Inspection Runtime foundation contracts (WP-01A)"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12.5,<2.13"]

[dependency-groups]
dev = [
  "pytest>=8.4.2,<8.5",
  "jsonschema>=4.25.1,<4.26",
  "ruff>=0.14.5,<0.15",
  "mypy>=1.18.2,<1.19",
  "uv_build==0.9.15",
]

[tool.uv]
required-version = ">=0.9.15,<0.10"

[[tool.uv.index]]
name = "jimu-pypi"
url = "https://pypi.org/simple"
# A project-scoped priority index prevents user-level mirror configuration from
# silently selecting a different registry. Resolution retains existing pins.
default = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/jimu_runtime"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
