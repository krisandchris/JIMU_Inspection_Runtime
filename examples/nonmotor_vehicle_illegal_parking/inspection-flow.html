<style>
:root{color-scheme:light;--paper:#f2f4f6;--ink:#142736;--muted:#536774;--line:#cbd4d8;--dark:#112f3d;--teal:#006e64;--mint:#b8f0db;--blue:#2459b1;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Inter","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
button,select{font:inherit;color:inherit}button,select,summary{cursor:pointer}button{border:1px solid var(--line);border-radius:6px;background:white;padding:6px 12px}button:hover:enabled,select:hover{border-color:var(--teal)}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #be7312;outline-offset:3px}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true]{background:var(--dark);color:white;border-color:var(--dark)}.mono,code,pre,.idx{font-family:var(--mono)}
header{background:var(--dark);color:#f1fff8;padding:13px max(4vw,20px);display:flex;gap:14px;align-items:center;border-bottom:3px solid #6ed2b4}.brand{font:800 23px/1 Arial;letter-spacing:.07em}.glyph{display:inline-grid;grid-template-columns:8px 8px;gap:3px;transform:skew(-12deg)}.glyph i{background:#94e9cb;height:8px}.glyph i:last-child{opacity:.45}.topnote{margin-left:auto;font-size:13px;color:#c4dbd7}.product{border-left:1px solid #547279;padding-left:14px;font:12px var(--mono);letter-spacing:.09em}
main{max-width:1470px;margin:auto;padding:27px clamp(16px,3.8vw,60px) 48px}
h1,h2,h3,p,figure,dl,dd{margin:0}h1{font-size:clamp(30px,3.1vw,49px);letter-spacing:-.045em;line-height:1.25}h2{font-size:20px;line-height:1.45}h3{font-size:16px}.intro,.row,.sectionhead,.viewerbar,.controls,.metas,.stepper{display:flex;align-items:center;gap:12px}.intro{justify-content:space-between;flex-wrap:wrap}.intro p{color:var(--muted);margin-top:7px}.controls{flex-wrap:wrap;gap:8px}.controls label{font-size:13px}.controls select{border:1px solid var(--line);padding:7px;background:white;border-radius:6px}.play{background:var(--dark);color:white;border-color:var(--dark)}.play b{color:#9ae2c9}.panel{border:1px solid var(--line);border-radius:10px;background:#fff;min-width:0;overflow:hidden}
.flow{margin:21px 0 16px;padding:15px 19px;background:#e7eeed}.sectionhead{justify-content:space-between;margin-bottom:10px}.sectionhead h2{font-size:15px}.sectionhead small,.soft{color:var(--muted)}.track{display:grid;grid-template-columns:1fr 23px 1fr 23px 1fr 32px 1.18fr 32px 1fr;align-items:center}
.node{text-align:left;padding:9px 12px;min-width:0;display:flex;align-items:center;gap:9px;line-height:1.3;width:100%;background:#fff}.node small{font:12px var(--mono);color:#466c72}.node[aria-pressed=true] small{color:#9ce2ca}.node strong{font-size:14px}.fork{display:grid;gap:5px}.fork .node{padding:6px 10px}.arrow{color:#477976;text-align:center}.wire{width:100%;height:48px;fill:none;stroke:#628681;stroke-width:1.5}

.caption{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 15px;background:#edf4f2;font-size:13px;color:#294c49}.key{width:10px;height:10px;border:2px solid #dd413c}.metas{display:grid;grid-template-columns:1.45fr .85fr 1fr;gap:10px;padding:14px 16px}.metas dt,.lineitem dt{font-size:12px;color:var(--muted)}.metas dd{font-weight:650;font-size:14px}
.inspector{padding:19px 21px}.phase{font:12px var(--mono);color:var(--teal);letter-spacing:.04em}.inspector h2{font-size:clamp(22px,2vw,30px);margin:4px 0 6px}.desc{font-size:14px;color:#405661}.io{margin:13px 0}.lineitem{padding:8px 0;border-top:1px solid #dce3e4;display:grid;grid-template-columns:45px 1fr;gap:8px;font-size:14px}.lineitem dt{font-weight:bold;padding-top:2px}.lineitem dd{overflow-wrap:anywhere}.stepper{border-top:1px solid var(--line);padding-top:13px;justify-content:space-between}.stepper button{font-size:13px}.stepper span{font:12px var(--mono);color:var(--muted)}

}
